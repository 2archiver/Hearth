# Lint Workflow — runs Android Lint on every push and pull request.
# Helps maintain code quality and catch potential bugs early.
#
# A failing run publishes the tail of the Gradle output (and the lint report, if one was
# produced) to the job summary so the cause is readable without downloading runner logs.

name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  android-lint:
    name: Android Lint (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            lint_task: :app:lintGoogletvDebug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Set up Android SDK with required components. NDK 28.2.13676358 is preinstalled on
      # ubuntu-latest; cmake;3.22.1 is not and AGP needs it for the native FairPlay/ALAC build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      # Write local.properties (AGP requires sdk.dir to locate the Android SDK)
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Run Android Lint — checks for correctness, security, and performance issues.
      # The lint configuration in app/build.gradle.kts controls what is reported.
      # See: https://developer.android.com/studio/write/lint
      - name: Run Android Lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ${{ matrix.lint_task }} --stacktrace 2>&1 | tee build.log

      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "## Lint failed — last 150 lines"
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "(no build log)"
            echo '```'
            echo ""
            echo "### Lint issues"
            echo '```'
            sed -n '1,80p' app/build/reports/lint-results-*.txt 2>/dev/null || echo "(no lint report was produced — the build failed before lint ran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runner logs live on a blob host that is awkward to reach and they expire; job summaries
      # are not readable through the REST API. So on failure, post the tail of the build log back
      # to the pull request (or to the commit, for pushes) where anyone — or any bot — can read it.
      - name: Report the failure where it can be read
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          body=$(mktemp)
          {
            echo "**${GITHUB_WORKFLOW} → ${GITHUB_JOB}** failed on \`${GITHUB_SHA:0:7}\`."
            echo ""
            echo "<details><summary>Last 120 lines of the build output</summary>"
            echo ""
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "(no build log — this step failed before Gradle ran)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$body"

          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            number=$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" \
              || echo "::warning::could not comment on PR #$number"
          else
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(cat "$body")" > /dev/null \
              || echo "::warning::could not comment on the commit"
          fi

      # Upload the lint report so it's easy to review in GitHub
      - name: Upload Lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-${{ matrix.flavor }}
          path: app/build/reports/lint-results-*.html
          retention-days: 30
          if-no-files-found: ignore
