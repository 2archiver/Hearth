# Publishes one canonical release: the newest successful build from main.
# The APK keeps a stable download name; the GitHub release title is read from the
# APK's embedded versionName, and its notes come from CHANGELOG.md (or recent commits).
#
# Direct download: https://github.com/<owner>/<repo>/releases/download/latest/PhairPlay-googletv.apk
# The same release is marked as GitHub's "Latest", so the in-app updater and the
# GitHub Releases page always point to the same build.

name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# Pushes and manual runs all update the same tag and release; never let them overlap.
concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish the latest Google TV APK
    runs-on: ubuntu-latest

    env:
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remember the currently published commit
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_sha=$(gh api "repos/$REPO/commits/latest" --jq '.sha' 2>/dev/null || true)
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Derive the APK version and update code
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be published from main. Select the main branch and run this workflow again."
            exit 1
          fi

          base=$(sed -n 's/^phairplay\.versionName=//p' gradle.properties | tr -d ' \r')
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Set phairplay.versionName in gradle.properties to a valid version (got: ${base:-missing})."
            exit 1
          fi

          # Every build is newer than the previous APK, including two runs in the same minute.
          # This numeric code is what Android uses to decide whether an APK can update an install.
          code=$(( $(date -u +%s) / 60 - 28401120 ))
          previous_body=$(gh api "repos/$REPO/releases/tags/latest" --jq '.body // ""' 2>/dev/null || true)
          previous_code=$(printf '%s\n' "$previous_body" \
            | grep -oE 'versionCode[[:space:]]+`?[0-9]+' \
            | grep -oE '[0-9]+' | tail -1 || true)
          if [[ -n "$previous_code" ]] && (( code <= previous_code )); then
            code=$((previous_code + 1))
          fi

          version="${base}-main.${GITHUB_RUN_NUMBER}"
          {
            echo "version=$version"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Building the latest release"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | \`main\` · \`${GITHUB_SHA:0:7}\` |"
            echo "| Build version | \`$version\` |"
            echo "| Android versionCode | \`$code\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # NDK 28.2.13676358 is preinstalled on ubuntu-latest; AGP needs the named CMake version.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD"
              echo "KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the configured release keystore."
            echo "Signing: configured release keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Using the repository's community signing key (app/signing/phairplay.p12)."
            echo "Signing: **community key** — later builds from this repository update in place." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APK
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_CODE: ${{ steps.meta.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleGoogletvRelease --stacktrace \
            -Pphairplay.versionName="$BUILD_VERSION" \
            -Pphairplay.versionCode="$BUILD_CODE" 2>&1 | tee build.log

      - name: Verify APK metadata and collect release assets
        id: assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/googletv/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one Google TV release APK, found ${#apks[@]}."
            exit 1
          fi
          src="${apks[0]}"

          aapt=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          if [[ -z "$aapt" ]]; then
            echo "::error::aapt was not found in the installed Android build-tools."
            exit 1
          fi
          metadata=$("$aapt" dump badging "$src" \
            | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2/p" \
            | head -1)
          if [[ -z "$metadata" ]]; then
            echo "::error::Could not read versionName/versionCode from the built APK."
            exit 1
          fi
          read -r apk_code apk_version <<< "$metadata"

          expected_version="${VERSION}-googletv"
          if [[ "$apk_version" != "$expected_version" || "$apk_code" != "$CODE" ]]; then
            echo "::error::APK metadata ($apk_version / $apk_code) did not match the requested build ($expected_version / $CODE)."
            exit 1
          fi

          mkdir -p dist
          cp "$src" dist/PhairPlay-googletv.apk
          (cd dist && sha256sum PhairPlay-googletv.apk > SHA256SUMS.txt)
          apk_sha256=$(sha256sum dist/PhairPlay-googletv.apk | cut -d' ' -f1)
          apk_size=$(stat -c%s dist/PhairPlay-googletv.apk)
          size_mb=$(python3 -c 'import sys; print(f"{int(sys.argv[1]) / 1048576:.1f}")' "$apk_size")

          APK_VERSION_NAME="$apk_version" APK_VERSION_CODE="$apk_code" \
          APK_SHA256="$apk_sha256" APK_SIZE="$apk_size" APK_TAG="latest" \
          APK_COMMIT="$GITHUB_SHA" python3 - <<'PY'
          import datetime
          import json
          import os

          descriptor = {
              "versionName": os.environ["APK_VERSION_NAME"],
              "versionCode": int(os.environ["APK_VERSION_CODE"]),
              "apk": "PhairPlay-googletv.apk",
              "sha256": os.environ["APK_SHA256"],
              "size": int(os.environ["APK_SIZE"]),
              "tag": os.environ["APK_TAG"],
              "commit": os.environ["APK_COMMIT"],
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open("dist/version.json", "w", encoding="utf-8") as descriptor_file:
              json.dump(descriptor, descriptor_file, indent=2)
              descriptor_file.write("\n")
          PY
          python3 -c "import json; json.load(open('dist/version.json', encoding='utf-8'))"

          {
            echo "version_name=$apk_version"
            echo "version_code=$apk_code"
            echo "sha256=$apk_sha256"
            echo "size_mb=$size_mb"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Verified APK"
            echo
            echo "- File: \`PhairPlay-googletv.apk\`"
            echo "- Version from the APK: \`$apk_version\`"
            echo "- Download size: ${size_mb} MB"
            echo "- SHA-256: \`$apk_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK signature
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ vars.EXPECTED_APK_CERT_SHA256 || 'b9cb7e4b4d5179870e672e850f5d3661f02c248f943dbaf10cd78cd0c047eaae' }}
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found in the installed Android build-tools."
            exit 1
          fi
          "$apksigner" verify --verbose dist/PhairPlay-googletv.apk
          fingerprint=$("$apksigner" verify --print-certs dist/PhairPlay-googletv.apk \
            | grep -m1 'SHA-256' | sed -E 's/.*SHA-256 digest: *//' \
            | tr '[:upper:]' '[:lower:]' | tr -d ':')
          expected=$(printf '%s' "${EXPECTED_FINGERPRINT:-}" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          echo "APK signing certificate SHA-256: $fingerprint"
          echo "Signing certificate SHA-256: \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$expected" || "$fingerprint" != "$expected" ]]; then
            echo "::error::Unexpected APK signing certificate. Expected $expected but got $fingerprint."
            exit 1
          fi

      - name: Confirm the version code is newer than the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.assets.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          previous_body=$(gh api "repos/$REPO/releases/tags/latest" --jq '.body // ""' 2>/dev/null || true)
          previous_code=$(printf '%s\n' "$previous_body" \
            | grep -oE 'versionCode[[:space:]]+`?[0-9]+' \
            | grep -oE '[0-9]+' | tail -1 || true)
          if [[ -n "$previous_code" ]] && (( CODE <= previous_code )); then
            echo "::error::versionCode $CODE must be higher than the currently published $previous_code."
            exit 1
          fi
          echo "The built APK can update the currently published version."

      - name: Make sure this is still the newest main commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "This build is the current tip of main; publishing it as latest."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer commit is already on main. Skipping this stale build; the queued run will publish the current commit."
          fi

      - name: Point the latest tag at this commit
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Publish the single latest release
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          VERSION: ${{ steps.assets.outputs.version_name }}
          CODE: ${{ steps.assets.outputs.version_code }}
          APK_SHA256: ${{ steps.assets.outputs.sha256 }}
          APK_SIZE_MB: ${{ steps.assets.outputs.size_mb }}
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/extract_release_notes.py CHANGELOG.md "$VERSION" > dist/changelog-notes.md
          : > dist/changes-since-last-build.md
          if [[ -n "${PREVIOUS_SHA:-}" && "$PREVIOUS_SHA" != "$GITHUB_SHA" ]]; then
            gh api "repos/$REPO/compare/${PREVIOUS_SHA}...${GITHUB_SHA}" \
              --jq '.commits[]? | "- " + (.commit.message | split("\n")[0])' \
              > dist/changes-since-last-build.md || true
          fi
          if [[ ! -s dist/changes-since-last-build.md && ! -s dist/changelog-notes.md ]]; then
            echo "No version-specific changelog entry is available yet. See the commit and changelog links below." \
              > dist/changes-since-last-build.md
          fi

          short_sha="${GITHUB_SHA:0:7}"
          title="PhairPlay ${VERSION} for Google TV"
          apk_url="https://github.com/${REPO}/releases/download/latest/PhairPlay-googletv.apk"
          {
            echo "# What's new in this build"
            if [[ -s dist/changes-since-last-build.md ]]; then
              echo
              echo "## Changes since the previous build"
              echo
              cat dist/changes-since-last-build.md
            fi
            if [[ -s dist/changelog-notes.md ]]; then
              echo
              echo "## Release summary"
              echo
              cat dist/changelog-notes.md
            fi
            cat <<EOF

          ## Download and update

          **Download the APK**: [PhairPlay-googletv.apk](${apk_url}) — this is the only APK in the release.

          - **Version:** \`${VERSION}\` · \`versionCode ${CODE}\`
          - **Size:** ${APK_SIZE_MB} MB · **SHA-256:** \`${APK_SHA256}\`
          - **TV update:** open **Settings → Updates → Check for updates**, or paste the direct APK link into Downloader.
          - **Computer:** \`adb install -r PhairPlay-googletv.apk\`

          Builds from this repository use the same signing key, so updates install over the existing app. A one-time reinstall is needed only when switching from a differently signed build.

          [Installation guide](https://github.com/${REPO}/blob/main/docs/guides/INSTALLATION.md) · [Full changelog](https://github.com/${REPO}/blob/main/CHANGELOG.md)

          **Build:** [\`${short_sha}\`](https://github.com/${REPO}/commit/${GITHUB_SHA}) · Google TV / Android TV OS 10+
          EOF
          } > dist/release-notes.md

          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            release_id=$(gh api "repos/$REPO/releases/tags/latest" --jq '.id')
            while IFS= read -r asset_id; do
              [[ -z "$asset_id" ]] || gh api --method DELETE "repos/$REPO/releases/assets/$asset_id"
            done < <(gh api "repos/$REPO/releases/$release_id" \
              --jq '.assets[] | select((.name | ascii_downcase | endswith(".apk")) and .name != "PhairPlay-googletv.apk") | .id')
            gh release upload latest \
              dist/PhairPlay-googletv.apk dist/SHA256SUMS.txt dist/version.json \
              --repo "$REPO" --clobber
            gh release edit latest --repo "$REPO" --title "$title" \
              --notes-file dist/release-notes.md --latest
            echo "Updated the current release."
          else
            gh release create latest \
              dist/PhairPlay-googletv.apk dist/SHA256SUMS.txt dist/version.json \
              --repo "$REPO" --title "$title" --notes-file dist/release-notes.md \
              --target "$GITHUB_SHA" --verify-tag --latest
            echo "Created the current release."
          fi

          {
            echo
            echo "## Published current release"
            echo
            echo "- [Release notes](https://github.com/${REPO}/releases/tag/latest)"
            echo "- [Download the APK](${apk_url})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the failure in the job summary and commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          report=$(mktemp)
          {
            echo "**${GITHUB_WORKFLOW} → ${GITHUB_JOB}** failed on \`${GITHUB_SHA:0:7}\`."
            echo
            echo "Errors:"
            echo '```'
            grep -E "^e: |error:|FAILURE: |What went wrong|FAILED|Execution failed for task|Lint found|A problem occurred|^Caused by: |tests? completed" build.log 2>/dev/null | head -80 || true
            echo '```'
            echo
            echo "<details><summary>Gradle failure details</summary>"
            echo
            echo '```'
            awk '/^FAILURE: Build/{f=1} f{print}' build.log 2>/dev/null | head -45 || true
            tail -n 40 build.log 2>/dev/null || echo "(Gradle did not run)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat "$report")" > /dev/null \
            || echo "::warning::Could not comment on the commit."
