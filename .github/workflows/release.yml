# Publishes one IMMUTABLE GitHub Release per successful build from main.
#
# Every run builds the Google TV APK, verifies it, and publishes it under its own
# versioned tag and its own GitHub Release:
#
# Development build (the default):
#   version (embedded): 2.1.0-main.<run_number>-googletv
#   git tag / release:  v2.1.0-main.<run_number>
#   sole asset:         Hearth-2.1.0-main.<run_number>-googletv.apk
#
# Stable milestone, published once when CHANGELOG.md has a section for the base version and
# no v<base> tag exists yet (this is how v2.1.0 is produced):
#   version (embedded): 2.1.0-googletv
#   git tag / release:  v2.1.0
#   sole asset:         Hearth-v2.1.0-android-tv.apk
#
# Nothing here is mutable history:
#   * tags are created once and pushed normally — there is NO force-push and NO moving tag;
#   * releases and assets are never deleted, pruned or overwritten in place — a rerun finds the
#     release it already owns and skips the upload instead of replacing it;
#   * the only rolling pointer is GitHub's own "Latest release" designation
#     (make_latest), which the in-app updater reads through GET /releases/latest.
#
# The historical release tagged `latest` (1.9.3) is intentionally left untouched: it stays
# downloadable forever, but it is no longer the updater's source of truth.

name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# Serialize publishing so two runs can never race over a tag or the Latest designation.
# A queued older run still publishes its own immutable release, but only the current tip
# of main is allowed to take the Latest designation (see the freshness step).
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish an immutable Google TV APK release
    runs-on: ubuntu-latest

    env:
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive the APK version, immutable tag and update code
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be published from main. Select the main branch and run this workflow again."
            exit 1
          fi

          base=$(sed -n 's/^phairplay\.versionName=//p' gradle.properties | tr -d ' \r')
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Set phairplay.versionName in gradle.properties to a valid version (got: ${base:-missing})."
            exit 1
          fi

          # ── Two publication kinds, still exactly one release per push ────────────────
          #
          #  * MILESTONE (stable): CHANGELOG.md carries a section for this exact version and no
          #    v<version> tag exists yet. Publishing the stable build here is deliberate: the
          #    repository's own gates (JVM protocol tests, TV UI render tests, lint, APK metadata,
          #    signing fingerprint, versionCode monotonicity) all run in THIS job before the tag is
          #    created, so nothing reaches a v2.1.0 tag that has not been validated. It also avoids
          #    a second, duplicate release job for the same commit via workflow_dispatch.
          #  * otherwise: the immutable per-run development build (unchanged 2.0 behaviour).
          #
          # A rerun keeps GITHUB_RUN_NUMBER, and the milestone tag is created last, so a failed
          # milestone build retries the milestone instead of publishing a stray dev build.
          milestone=false
          # Fixed-string match on the Keep a Changelog heading, so version dots are not a regex.
          if grep -qF "## [${base}]" CHANGELOG.md 2>/dev/null; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/v${base}" >/dev/null 2>&1; then
              milestone=true
            fi
          fi

          if [[ "$milestone" == "true" ]]; then
            # Stable release: v2.1.0, APK versionName 2.1.0-googletv (the flavor suffix is added by
            # Gradle), asset Hearth-v2.1.0-android-tv.apk.
            version="$base"
            tag="v${version}"
          else
            # One build version per workflow run. GITHUB_RUN_NUMBER is stable across reruns of
            # the same run, so a rerun rebuilds the SAME immutable release instead of minting a
            # new one — that is what makes reruns idempotent.
            version="${base}-main.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
          fi

          # Every build is newer than the previous APK, including two runs in the same minute.
          # This numeric code is what Android uses to decide whether an APK can update an install.
          code=$(( $(date -u +%s) / 60 - 28401120 ))

          # The rolling pointer is GitHub's Latest *designation*, queried through the standard
          # /releases/latest endpoint — never a git tag named "latest".
          previous_tag=""
          previous_code=""
          previous_commit=""
          if latest_body=$(gh api "repos/$REPO/releases/latest" --jq '.body // ""' 2>/dev/null); then
            previous_tag=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name // ""' 2>/dev/null || true)
            previous_code=$(printf '%s\n' "$latest_body" \
              | grep -oE 'versionCode[[:space:]]+`?[0-9]+' \
              | grep -oE '[0-9]+' | tail -1 || true)
            if [[ -n "$previous_tag" && "$previous_tag" != "$tag" ]]; then
              # The commits endpoint resolves both lightweight and annotated tags to a SHA,
              # unlike targetCommitish (which is just the branch name).
              previous_commit=$(gh api "repos/$REPO/commits/$previous_tag" \
                --jq '.sha' 2>/dev/null || true)
            fi
          fi
          if [[ -n "$previous_code" && "$previous_tag" != "$tag" ]] && (( code <= previous_code )); then
            code=$((previous_code + 1))
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "milestone=$milestone"
            echo "code=$code"
            echo "previous_tag=$previous_tag"
            echo "previous_commit=$previous_commit"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Building an immutable release"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | \`main\` · \`${GITHUB_SHA:0:7}\` |"
            echo "| Build version | \`$version\` |"
            echo "| Release kind | $( [[ "$milestone" == "true" ]] && echo "stable milestone" || echo "per-run development build" ) |"
            echo "| Tag / release | \`$tag\` |"
            echo "| Android versionCode | \`$code\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # NDK 28.2.13676358 is preinstalled on ubuntu-latest; AGP needs the named CMake version.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD"
              echo "KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the configured release keystore."
            echo "Signing: configured release keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Using the repository's community signing key (app/signing/phairplay.p12)."
            echo "Signing: **community key** — later builds from this repository update in place." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate release automation, protocol logic and TV interface
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_extract_release_notes.py
          python3 tools/test_release_workflow.py
          python3 tools/check-workflows.py .github/workflows/*.yml
          ./gradlew :test-runner:test :app:lintGoogletvDebug --stacktrace 2>&1 | tee build.log
          ./gradlew :app:testGoogletvDebugUnitTest --tests 'com.phairplay.ui.HearthUiTest' --tests 'com.phairplay.airplay.VideoDecoderSpsTest' --stacktrace 2>&1 | tee -a build.log

      - name: Build release APK
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_CODE: ${{ steps.meta.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleGoogletvRelease --stacktrace \
            -Pphairplay.versionName="$BUILD_VERSION" \
            -Pphairplay.versionCode="$BUILD_CODE" \
            -Pphairplay.updateRepo=2archiver/Hearth 2>&1 | tee -a build.log

      - name: Verify generated updater repository
        shell: bash
        run: |
          set -euo pipefail
          build_config=$(find app/build/generated/source/buildConfig \
            -path '*/googletv/release/com/phairplay/BuildConfig.java' -print -quit)
          if [[ -z "$build_config" ]] || ! grep -Fq 'UPDATE_REPO = "2archiver/Hearth";' "$build_config"; then
            echo "::error::Release BuildConfig.UPDATE_REPO is not 2archiver/Hearth."
            [[ -z "$build_config" ]] || grep -n 'UPDATE_REPO' "$build_config" || true
            exit 1
          fi
          echo "Verified release updater target: 2archiver/Hearth" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK metadata and collect release asset
        id: assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.code }}
          IS_MILESTONE: ${{ steps.meta.outputs.milestone }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/googletv/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one Google TV release APK, found ${#apks[@]}."
            exit 1
          fi
          src="${apks[0]}"

          aapt=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          if [[ -z "$aapt" ]]; then
            echo "::error::aapt was not found in the installed Android build-tools."
            exit 1
          fi
          metadata=$("$aapt" dump badging "$src" \
            | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p" \
            | head -1)
          if [[ -z "$metadata" ]]; then
            echo "::error::Could not read applicationId/versionName/versionCode from the built APK."
            exit 1
          fi
          read -r apk_package apk_code apk_version <<< "$metadata"

          expected_version="${VERSION}-googletv"
          if [[ "$apk_package" != "com.hearth.tv" || \
                "$apk_version" != "$expected_version" || "$apk_code" != "$CODE" ]]; then
            echo "::error::APK metadata ($apk_package / $apk_version / $apk_code) did not match the preserved package and requested build (com.hearth.tv / $expected_version / $CODE)."
            exit 1
          fi

          # Both supported ARM ABIs must be inside the published APK. A build that quietly lost
          # armeabi-v7a (for example after an NDK or abiFilters change) would still install on
          # 64-bit TVs, so nothing else in the pipeline would notice — older 32-bit Google TV
          # devices would simply stop receiving updates.
          apk_abis=$(unzip -Z1 "$src" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          missing_abis=""
          for abi in armeabi-v7a arm64-v8a; do
            if ! printf '%s\n' "$apk_abis" | tr ' ' '\n' | grep -qx "$abi"; then
              missing_abis="${missing_abis} ${abi}"
            fi
          done
          if [[ -n "$missing_abis" ]]; then
            echo "::error::The release APK is missing supported ABI(s):${missing_abis}. Found: ${apk_abis:-none}."
            exit 1
          fi

          # One immutable release, one asset: the ONLY thing published is the version-named APK.
          # Its SHA-256 and versionCode are written into the release body below, which is where
          # a person reads them and where update/ReleaseParser scrapes them.
          # Stable releases use the predictable Android TV name from the release brief; per-run
          # development builds keep the embedded-version name (this one APK serves both ARM ABIs,
          # but it is never advertised as a catch-all build).
          apk_name="Hearth${apk_version%-googletv}.apk"
          mkdir -p dist
          cp "$src" "dist/$apk_name"
          apk_sha256=$(sha256sum "dist/$apk_name" | cut -d' ' -f1)
          apk_size=$(stat -c%s "dist/$apk_name")
          size_mb=$(python3 -c 'import sys; print(f"{int(sys.argv[1]) / 1048576:.1f}")' "$apk_size")

          {
            echo "apk_name=$apk_name"
            echo "version_name=$apk_version"
            echo "version_code=$apk_code"
            echo "sha256=$apk_sha256"
            echo "size_bytes=$apk_size"
            echo "size_mb=$size_mb"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Verified APK"
            echo
            echo "- Single release asset: \`$apk_name\`"
            echo "- Version from the APK: \`$apk_version\`"
            echo "- Native ABIs in the APK: \`$apk_abis\`"
            echo "- Download size: ${size_mb} MB"
            echo "- SHA-256: \`$apk_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK signature
        shell: bash
        env:
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
          EXPECTED_FINGERPRINT: ${{ vars.EXPECTED_APK_CERT_SHA256 || 'b9cb7e4b4d5179870e672e850f5d3661f02c248f943dbaf10cd78cd0c047eaae' }}
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found in the installed Android build-tools."
            exit 1
          fi
          "$apksigner" verify --verbose dist/"$APK_NAME"
          fingerprint=$("$apksigner" verify --print-certs dist/"$APK_NAME" \
            | grep -m1 'SHA-256' | sed -E 's/.*SHA-256 digest: *//' \
            | tr '[:upper:]' '[:lower:]' | tr -d ':')
          expected=$(printf '%s' "${EXPECTED_FINGERPRINT:-}" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          echo "APK signing certificate SHA-256: $fingerprint"
          echo "Signing certificate SHA-256: \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$expected" || "$fingerprint" != "$expected" ]]; then
            echo "::error::Unexpected APK signing certificate. Expected $expected but got $fingerprint."
            exit 1
          fi

      - name: Confirm the version code is newer than the currently designated Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          CODE: ${{ steps.assets.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name // ""' 2>/dev/null || true)
          if [[ -n "$latest_tag" && "$latest_tag" == "$TAG" ]]; then
            # A rerun of the run that already owns this release: the gate below compares the
            # release against itself, so it is skipped rather than failed.
            echo "Rerun of $TAG: the release already exists and keeps its versionCode."
            exit 0
          fi
          latest_body=$(gh api "repos/$REPO/releases/latest" --jq '.body // ""' 2>/dev/null || true)
          previous_code=$(printf '%s\n' "$latest_body" \
            | grep -oE 'versionCode[[:space:]]+`?[0-9]+' \
            | grep -oE '[0-9]+' | tail -1 || true)
          if [[ -n "$previous_code" ]] && (( CODE <= previous_code )); then
            echo "::error::versionCode $CODE must be higher than the currently designated Latest release ($previous_code)."
            exit 1
          fi
          echo "The built APK can update the currently published version."

      - name: Decide whether this build is still the tip of main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "This build is the current tip of main; its release will take the Latest designation."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer commit is already on main. The immutable release is still published for this commit, but it will not take the Latest designation."
          fi

      # Workflow artifacts are separate from GitHub Releases: this never deletes or replaces a
      # release asset, and retention-days only governs the artifact, not the published release.
      # The build log is uploaded on EVERY outcome so a failed Gradle build or publication is
      # debuggable from the run even when no APK was produced.
      - name: Upload the build log as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log-${{ steps.meta.outputs.version }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the signed APK as a workflow artifact
        if: always() && steps.assets.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-googletv-${{ steps.meta.outputs.version }}
          path: dist/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Create the immutable version tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Unique per run number; a normal push that refuses to overwrite anything.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists (rerun). Keeping the existing tag and its commit."
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "Hearth $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish the immutable release (idempotent)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_COMMIT: ${{ steps.meta.outputs.previous_commit }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.assets.outputs.version_name }}
          CODE: ${{ steps.assets.outputs.version_code }}
          APK_SHA256: ${{ steps.assets.outputs.sha256 }}
          APK_SIZE_BYTES: ${{ steps.assets.outputs.size_bytes }}
          APK_SIZE_MB: ${{ steps.assets.outputs.size_mb }}
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
          IS_CURRENT: ${{ steps.freshness.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/extract_release_notes.py CHANGELOG.md "$VERSION" > dist/changelog-notes.md
          : > dist/changes-since-last-build.md
          if [[ -n "${PREVIOUS_COMMIT:-}" && "$PREVIOUS_COMMIT" != "$GITHUB_SHA" ]]; then
            gh api "repos/$REPO/compare/${PREVIOUS_COMMIT}...${GITHUB_SHA}" \
              --jq '.commits[]? | "- " + (.commit.message | split("\n")[0])' \
              > dist/changes-since-last-build.md || true
          fi
          if [[ ! -s dist/changes-since-last-build.md && ! -s dist/changelog-notes.md ]]; then
            echo "No version-specific changelog entry is available yet. See the commit and changelog links below." \
              > dist/changes-since-last-build.md
          fi

          short_sha="${GITHUB_SHA:0:7}"
          title="Hearth ${VERSION%-googletv}"
          apk_url="https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}"
          {
            echo "# What's new in this build"
            if [[ -s dist/changes-since-last-build.md ]]; then
              echo
              echo "## Changes since the previous release"
              echo
              cat dist/changes-since-last-build.md
            fi
            if [[ -s dist/changelog-notes.md ]]; then
              echo
              echo "## Release summary"
              echo
              cat dist/changelog-notes.md
            fi
            cat <<EOF

          ## Download and update

          **Download the APK**: [${APK_NAME}](${apk_url}) — this release carries this one file and nothing else.

          - **Version:** \`${VERSION}\` · \`versionCode ${CODE}\`
          - **Size:** ${APK_SIZE_MB} MB · **SHA-256:** \`${APK_SHA256}\`
          - **ABIs:** \`armeabi-v7a\` + \`arm64-v8a\` (unchanged; 32-bit Google TV devices are still supported)
          - **TV update:** open **Settings → Updates → Check for updates**, or paste the direct APK link into Downloader.
          - **Computer:** \`adb install -r ${APK_NAME}\`

          - **SHA-256 of the file above:** \`${APK_SHA256}\` — the in-app updater compares this
            before installing, so a truncated download is rejected rather than offered as an update.

          Builds from this repository use the same signing key, so updates install over the existing app. A one-time reinstall is needed only when switching from a differently signed build.

          [Installation guide](https://github.com/${REPO}/blob/main/docs/guides/INSTALLATION.md) · [Full changelog](https://github.com/${REPO}/blob/main/CHANGELOG.md)

          **Build:** [\`${short_sha}\`](https://github.com/${REPO}/commit/${GITHUB_SHA}) · Google TV / Android TV OS 10+
          EOF
          } > dist/release-notes.md

          # gh api prints the error JSON on stdout even when it exits nonzero (404).
          # Only use the response as a release ID when the request succeeds.
          existing_id=""
          if release_id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null); then
            existing_id="$release_id"
          fi
          if [[ -n "$existing_id" ]]; then
            # Rerun: the release already exists. Never delete or replace its asset — if the same
            # file name is already present with the same size, the upload is simply skipped.
            existing_size=$(gh api "repos/$REPO/releases/$existing_id" \
              --jq ".assets[] | select(.name == \"$APK_NAME\") | .size" 2>/dev/null | head -1 || true)
            if [[ -n "$existing_size" ]]; then
              if [[ "$existing_size" != "$APK_SIZE_BYTES" ]]; then
                echo "::error::Release $TAG already contains $APK_NAME with a different size ($existing_size != $APK_SIZE_BYTES). Refusing to overwrite a published artifact; investigate manually."
                exit 1
              fi
              echo "Release $TAG already carries $APK_NAME with the expected size; skipping upload."
            else
              gh release upload "$TAG" "dist/$APK_NAME" --repo "$REPO"
            fi
            gh release edit "$TAG" --repo "$REPO" --title "$title" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" \
              "dist/$APK_NAME" \
              --repo "$REPO" --title "$title" --notes-file dist/release-notes.md \
              --target "$GITHUB_SHA" --verify-tag
            existing_id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id')
          fi

          # GitHub's Latest designation is the only rolling pointer. No git tag is moved.
          if [[ "$IS_CURRENT" == "true" ]]; then
            gh api -X PATCH "repos/$REPO/releases/$existing_id" -f make_latest=true >/dev/null
            echo "Marked $TAG as GitHub's Latest release."
          else
            gh api -X PATCH "repos/$REPO/releases/$existing_id" -f make_latest=false >/dev/null
            echo "Published $TAG without taking the Latest designation (a newer main commit exists)."
          fi

          {
            echo
            echo "## Published immutable release"
            echo
            echo "- Tag: \`$TAG\` (never moved or rewritten)"
            echo "- [Release notes](https://github.com/${REPO}/releases/tag/${TAG})"
            echo "- [Download the APK](${apk_url})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the failure in the job summary and commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          report=$(mktemp)
          {
            echo "**${GITHUB_WORKFLOW} → ${GITHUB_JOB}** failed on \`${GITHUB_SHA:0:7}\`."
            echo
            echo "Errors:"
            echo '```'
            grep -E "^e: |error:|FAILURE: |What went wrong|FAILED|Execution failed for task|Lint found|A problem occurred|^Caused by: |tests? completed" build.log 2>/dev/null | head -80 || true
            echo '```'
            echo
            echo "<details><summary>Gradle failure details</summary>"
            echo
            echo '```'
            awk '/^FAILURE: Build/{f=1} f{print}' build.log 2>/dev/null | head -45 || true
            tail -n 40 build.log 2>/dev/null || echo "(Gradle did not run)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat "$report")" > /dev/null \
            || echo "::warning::Could not comment on the commit."
