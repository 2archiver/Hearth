# TEMPORARY diagnostic: proves whether GitHub's internal scheduler can run
# workflows in this repository while integration-token dispatch is blocked.
# Scheduled runs are created by GitHub itself, not by the integration token.
# This file is removed once the question is answered.
name: Schedule probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record scheduler activity
        run: |
          echo "Scheduler ran at $(date -u +%FT%TZ)"
          echo "## Schedule probe fired" >> "$GITHUB_STEP_SUMMARY"
          echo "Event: $GITHUB_EVENT_NAME at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
