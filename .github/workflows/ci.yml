# Pull requests are verified here; main runs the same gates once in Release.
name: CI

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'ACKNOWLEDGEMENTS.md'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  android-build:
    name: Verify Google TV
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            lint_task: :app:lintGoogletvDebug
            assemble_task: :app:assembleGoogletvDebug
            apk_path: app/build/outputs/apk/googletv/debug/app-googletv-debug.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate release automation
        run: |
          python3 tools/test_extract_release_notes.py
          python3 tools/test_release_workflow.py
          python3 tools/check-workflows.py .github/workflows/*.yml

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # NDK 28.2.13676358 is preinstalled on ubuntu-latest; cmake;3.22.1 is not and AGP needs
      # it for the native FairPlay/ALAC build. Naming both avoids an auto-download mid-build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Lint and build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :test-runner:test ${{ matrix.lint_task }} ${{ matrix.assemble_task }} --stacktrace 2>&1 | tee build.log

      # HearthUiTest inflates the real TV layouts under Robolectric's native graphics mode and
      # writes rendered previews to app/build/reports/hearth-ui/, which the build-reports
      # artifact below already uploads. Appending to build.log keeps a test failure visible in
      # the PR comment that the failure reporter writes.
      - name: TV interface tests and native layout previews
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testGoogletvDebugUnitTest --tests 'com.phairplay.ui.HearthUiTest' --tests 'com.phairplay.airplay.VideoDecoderSpsTest' --tests 'com.phairplay.airplay.MediaHttpDataSourceTest' --stacktrace 2>&1 | tee -a build.log

      # Lint aborts the build with nothing but "Lint found errors in the project", which is
      # useless in a PR comment. The text report names the file, the line and the check id,
      # so fold it into build.log before the failure reporter reads that log.
      - name: Fold lint findings into the build log
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          for f in app/build/reports/lint-results*.txt; do
            [ -f "$f" ] || continue
            { echo "===== $f ====="; cat "$f"; } >> build.log
          done || true

      - name: Report the failure (job summary + comment)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          report=$(mktemp)
          {
            echo "**${GITHUB_WORKFLOW} → ${GITHUB_JOB}** failed on \`${GITHUB_SHA:0:7}\`."
            echo ""
            echo "Errors:"
            echo '```'
            # FAILED also catches Gradle's "SomeTest > some case FAILED" lines, which is how a
            # failing unit test names itself; head keeps a wall of warnings from pushing the
            # real error out of the report. AssertionError/ComparisonFailure/expected:< pick up
            # the assertion text a failing unit test prints (see testLogging in
            # app/build.gradle.kts), and "at com.phairplay" names the line of ours behind it.
            grep -E "^e: |error:|Error: |AssertionError|ComparisonFailure|expected:<|at com\.phairplay|FAILURE: |What went wrong|FAILED|Execution failed for task|Lint found|A problem occurred|^Caused by: |tests? completed" build.log 2>/dev/null | head -80 || true
            echo '```'
            echo ""
            echo "<details><summary>Gradle failure block and last 40 lines</summary>"
            echo ""
            echo '```'
            awk '/^FAILURE: Build/{f=1} f{print}' build.log 2>/dev/null | head -45 || true
            echo "--- tail ---"
            tail -n 40 build.log 2>/dev/null || echo "(no build log — this step failed before Gradle ran)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            gh pr comment "$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")" \
              --repo "$GITHUB_REPOSITORY" --body-file "$report" \
              || echo "::warning::could not comment on the pull request"
          else
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(cat "$report")" > /dev/null \
              || echo "::warning::could not comment on the commit"
          fi

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            test-runner/build/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk-${{ matrix.flavor }}
          path: ${{ matrix.apk_path }}
          retention-days: 7
